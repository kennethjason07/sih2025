<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Login - No Icons</title>
    <link rel="stylesheet" href="styles/main.css">
    <!-- Add Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Add favicon -->
    <link rel="icon" type="image/x-icon" href="logo/logo.ico">
    <!-- Font Awesome removed as per user request -->
    <style>
        .test-section {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header class="header-gradient slide-in-down">
        <div class="container">
            <div class="logo-container">
                <img src="logo/logo.png" alt="Maximus Consultancy Services Logo" class="header-logo">
                <div class="header-text">
                    <h1 class="fade-in">SIH 2025 Admin Login</h1>
                    <p class="fade-in">Secure access to the administrator dashboard</p>
                    <p class="made-by">Made by Maximus Consultancy Services</p>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="auth-container">
            <h2>Admin Login</h2>
            <form id="adminLoginForm" autocomplete="off">
                <div class="form-group">
                    <label for="email" class="required">Admin Email</label>
                    <div class="input-group">
                        <input type="email" id="email" required autocomplete="off" value="" placeholder="Enter your admin email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="required">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" required autocomplete="off" value="" placeholder="Enter your password">
                    </div>
                </div>
                <button type="submit" class="btn">
                    Login as Admin
                </button>
                <p style="text-align: center; margin-top: 1rem;">
                    <a href="index.html">Back to User Login</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
