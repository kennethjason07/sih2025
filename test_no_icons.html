<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - No Icons Implementation</title>
    <link rel="stylesheet" href="styles/main.css">
    <!-- Add Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Add favicon -->
    <link rel="icon" type="image/x-icon" href="logo/logo.ico">
    <!-- Font Awesome removed as per user request -->
    <style>
        .test-section {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .test-input {
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <header class="header-gradient slide-in-down">
        <div class="container">
            <div class="logo-container">
                <img src="logo/logo.png" alt="Maximus Consultancy Services Logo" class="header-logo">
                <div class="header-text">
                    <h1 class="fade-in">SIH 2025 No Icons Test</h1>
                    <p class="fade-in">Testing implementation without icons</p>
                    <p class="made-by">Made by Maximus Consultancy Services</p>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <h1 class="fade-in">Test - No Icons Implementation</h1>
        
        <div class="test-section">
            <h2>Input Group Test</h2>
            <div class="form-group">
                <label for="testInput">Test Input</label>
                <div class="input-group">
                    <input type="text" id="testInput" placeholder="This should work without icons">
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Button Test</h2>
            <button class="btn btn-success">Normal Button</button>
            <button class="btn btn-secondary">Secondary Button</button>
        </div>
        
        <div class="test-section">
            <h2>Card Test</h2>
            <div class="card">
                <div class="card-header">
                    <h3>Test Card</h3>
                </div>
                <p>This card should display properly without icons</p>
            </div>
        </div>
    </div>
</body>
</html>
